function avatarWheels(){let out='';for(let [key,labels] of Object.entries(AVATAR_OPTIONS)){let n=workingAvatar[key];out+=`<div class="picker"><div class="picker-head"><label>${key==='hairColor'?'Hair color':cap(key)}</label><div class="picker-nav"><button data-action="wheel-prev" data-key="${key}" aria-label="Previous ${key}">‹</button><span>${n+1}/${labels.length}</span><button data-action="wheel-next" data-key="${key}" aria-label="Next ${key}">›</button></div></div><div class="wheel" data-wheel="${key}">${labels.map((label,i)=>`<button class="wheel-option ${n===i?'active':''} ${key==='skin'||key==='hairColor'?'swatch':''}" data-action="wheel-set" data-key="${key}" data-value="${i}" title="${esc(label)}" ${key==='skin'||key==='hairColor'?`style="--swatch:${key==='skin'?COLORS.skin[i]:COLORS.hair[i]}"`:''}>${key==='skin'||key==='hairColor'?'':esc(label)}</button>`).join('')}</div></div>`}return out}
function updateAvatar(){let prev=document.querySelector('#avatar-preview');if(prev){prev.className='big-preview bg-'+workingAvatar.bg;prev.innerHTML=pixelHero(workingAvatar,workingClass,true);} let holder=document.querySelector('#avatar-wheels');if(holder){let scroll=holder.scrollTop;holder.innerHTML=avatarWheels();holder.scrollTop=scroll;let selected=holder.querySelectorAll('.wheel-option.active');selected.forEach(x=>x.scrollIntoView({block:'nearest',inline:'nearest'}))}let foot=document.querySelector('.preview-footer span');if(foot)foot.textContent=BG[workingAvatar.bg]}
function classCard(c){let active=workingClass===c;const glyph={Knight:'♜',Mage:'✦',Healer:'✚',Rogue:'◈',Bowman:'➶'}[c];const desc={Knight:'Steel-clad frontliner with shielded resolve.',Mage:'Runic caster with starbound robes and arcane focus.',Healer:'Sacred support wrapped in white and emerald blessings.',Rogue:'Masked skirmisher who strikes from the shadows.',Bowman:'Longbow marksman inspired by old English war-archers.'}[c];return `<button class="class-card ${active?'selected':''}" data-action="choose-class" data-class="${c}" ${state&&state.level<10&&c!==state.className?'disabled':''} style="--accent:${CLASS_COLORS[c]}"><div class="class-symbol">${glyph}</div><div class="class-name">${c}</div><p>${desc}</p><div class="class-avatar bg-${workingAvatar.bg}">${pixelHero(workingAvatar,c,true,true)}</div><span class="class-state">${active?'SELECTED PATH':'CHOOSE THIS CLASS'}</span></button>`}
function dashboard(){let page=tab==='habits'?habitsPage():tab==='todos'?todosPage():tab==='rewards'?rewardsPage():realmPage();const nav=[['habits','✦','Habits'],['todos','✓','To-Dos'],['rewards','◉','Rewards'],['realm','◆','Realm']];return `<div class="app-shell"><main class="main-container">${page}</main><nav class="bottom-nav">${nav.map(([id,glyph,name])=>`<button data-action="tab" data-tab="${id}" class="${tab===id?'active':''}"><span class="bottom-glyph ${id}">${glyph}</span><small>${name}</small></button>`).join('')}</nav></div>${modal?modalView():''}`}
function statsHeader(title='Habits',addAction='habit-add'){return `<div class="habit-top"><div class="title-spacer"></div><h1>${title}</h1>${addAction?button('+',addAction,'','add-circle'):'<span></span>'}</div><div class="hero-status"><div class="hero-portrait-stack"><button class="portrait-link bg-${state.avatar.bg} ${state.activeCosmetics.Frame?'fancy-frame':''}" data-action="avatar-edit" title="Edit your avatar">${pixelHero(state.avatar,state.className)}<span>EDIT</span></button><span class="level-chip">Lvl ${state.level}</span></div><div class="hero-stat-panel"><span class="class-chip" style="--class:${CLASS_COLORS[state.className]}">${esc(state.className)}</span><div class="stat-stack">${[['HP',state.hp,maxHp(state.level),'hp'],['XP',state.xp,xpNeeded(state.level),'xp'],['MP',state.level<10?0:state.mp,maxMp(state.level),'mp']].map(([n,v,max,k])=>`<div class="stat-row"><div class="stat-label"><b>${n}</b><span>${k==='mp'&&state.level<10?'Unlocks at level 10':`${v} / ${max}`}</span></div>${bar(v,max,k)}</div>`).join('')}</div><div class="resource-row"><div>💎 <strong>${state.gems||0} Gems</strong></div><div>${goldIcon} <strong>${state.gold} Gold</strong></div></div></div></div>`}
function habitsPage(){let list=state.habits.filter(h=>due(h)&& (habitFilter==='all'||h.kind===habitFilter)),num=state.habits.filter(h=>due(h)&&h.kind==='good').length,done=state.habits.filter(h=>due(h)&&h.kind==='good'&&h.doneDates.includes(today())).length;return `${statsHeader()}<section class="content-head"><div><div class="eyebrow">${esc(fmtDate(today()))}</div><h2>Daily Quests <small>${done}/${num}</small></h2></div><div class="filter-tabs">${['all','good','bad'].map(f=>button(cap(f),'filter-habit',`data-filter="${f}"` ,`filter ${habitFilter===f?'selected':''}`)).join('')}</div></section><div class="quest-list">${list.length?list.map(h=>habitCard(h)).join(''):`<div class="empty-card"><div class="empty-glyph">✧</div><h3>No quests here yet.</h3><p>Create a habit to turn your day into a small adventure.</p>${button('+ Create Habit','habit-add','','btn outline')}</div>`}</div><div class="section-head"><h2>Current Threat</h2><span>RAID PREVIEW</span></div><button class="boss-peek" data-action="open-section" data-section="Boss"><div class="peek-art">${bossArt(state.bossWins)}</div><div><strong>${getBoss().name}</strong><small>${getBoss().subtitle}</small>${bar(state.bossHp,getBoss().hp+Math.floor(state.bossWins/3)*35,'hp')}</div><span class="arrow">›</span></button>`}
function habitCard(h){let done=h.doneDates.includes(today()),slipped=h.slips.includes(today()),isGood=h.kind==='good';return `<div class="quest-card ${isGood?'positive':'negative'} ${done?'completed':''}"><button class="quest-check ${done?'checked':''} ${slipped?'slipped':''}" data-action="${isGood?'finish-habit':'slip-habit'}" data-id="${h.id}" ${done||slipped?'disabled':''}><span class="check-anim">${isGood?'<svg viewBox="0 0 30 30"><path d="M5 16 L12 23 L25 7"/></svg>':'!'}</span></button><div class="quest-body"><strong>${esc(h.title)}</strong><small>${isGood?done?'Quest completed · +12 XP':'+12 XP · +5 gold':slipped?'Slip logged · fresh start tomorrow':'Avoid today · clean-day bonus'}${h.streak?` · ${h.streak}-day streak`:''}</small></div>${button('⋯','habit-options',`data-id="${h.id}"`,'mini-more')}</div>`}
function todosPage(){return `<div class="heading-row"><div><div class="eyebrow">SMALL WINS, REAL PROGRESS</div><h1>To-Dos</h1><p>Finish your quests for XP, gold and boss damage.</p></div>${button('+','todo-add','','add-circle')}</div><div class="section-head"><h2>Active Quests</h2><span>${state.todos.filter(t=>!t.done).length} REMAINING</span></div><div class="quest-list">${state.todos.filter(t=>!t.done).map(t=>`<div class="quest-card positive"><button class="quest-check" data-action="finish-todo" data-id="${t.id}"><span class="check-anim"><svg viewBox="0 0 30 30"><path d="M5 16 L12 23 L25 7"/></svg></span></button><div class="quest-body"><strong>${esc(t.title)}</strong><small>+18 XP · +8 gold ${t.dueDate?'· Due '+esc(t.dueDate):''}</small></div>${button('×','remove-todo',`data-id="${t.id}"`,'mini-more')}</div>`).join('')||`<div class="empty-card">Your quest list is clear. Add your next objective.</div>`}</div><div class="section-head"><h2>Completed</h2></div><div class="quest-list">${state.todos.filter(t=>t.done).map(t=>`<div class="quest-card completed"><span class="done-glyph">✓</span><div class="quest-body"><strong>${esc(t.title)}</strong><small>Quest completed</small></div>${button('×','remove-todo',`data-id="${t.id}"`,'mini-more')}</div>`).join('')||'<div class="muted-text">Completed To-Dos appear here.</div>'}</div>`}
function rewardsPage(){return `${statsHeader('Rewards','reward-add')}<div class="heading-row"><div><div class="eyebrow">EARN IT. ENJOY IT.</div><p>Spend earned currency on intentional downtime.</p></div><div class="pill-gold">${goldIcon} ${state.gold}</div></div><div class="reward-hero"><strong>${state.rewardMinutes} minutes</strong><small>Available break allowance · manually tracked</small></div><div class="notice"><b>Device blocking is not active.</b> This browser app cannot enforce system-wide restrictions. The controls below are a working allowance planner and concept UI.</div><div class="section-head"><h2>Break Shop</h2>${button('+ Custom Reward','reward-add','','btn thin')}</div>${state.rewards.map(r=>`<div class="store-line"><div class="store-symbol">◉</div><div><strong>${esc(r.title)}</strong><small>+${r.minutes} allowance minutes</small></div>${button(`${goldIcon} ${r.cost}`,'buy-reward',`data-id="${r.id}" ${state.gold<r.cost?'disabled':''}`,'btn gold-button')}</div>`).join('')}<div class="section-head"><h2>Spend Your Time</h2></div><div class="spend-grid">${[5,15,30].map(n=>button(`Use ${n} min`,'spend-minutes',`data-minutes="${n}" ${state.rewardMinutes<n?'disabled':''}`,'btn outline')).join('')}</div><div class="section-head"><h2>Focus & Restrictions</h2></div><div class="panel"><div class="setting-line"><div><strong>Restricted sites</strong><small>${esc(state.selectedRestrictions.join(', ')||'No categories selected')}</small></div>${button('Manage','open-section','data-section="Focus"','btn outline')}</div><div class="setting-line"><div><strong>Restriction intent</strong><small>Configured for later native integration; no actual blocking.</small></div><span class="status-tag">CONCEPT</span></div></div>`}
function realmPage(){return section?realmSection():`<div class="heading-row"><div><div class="eyebrow">YOUR ADVENTURE</div><h1>Realm</h1><p>Character, quests, companions, guild and progress.</p></div></div><button class="profile-banner" data-action="open-section" data-section="Profile"><div class="profile-pixel bg-${state.avatar.bg} ${state.activeCosmetics.Frame?'fancy-frame':''}">${pixelHero(state.avatar,state.className)}</div><div><strong>${esc(state.name)}</strong><small>Level ${state.level} · ${state.className}</small><span>${goldIcon} ${state.gold} gold</span></div><span>›</span></button><div class="realm-list">${[['Stats','▤','Vitals and RPG attributes'],['Skills','✦','Power unlocked at level 10'],['Equipment','⚔','Gear, stats and costume'],['Pets','♧','Egg hatching and companions'],['Boss','☄','Ominous raids and combat log'],['Challenges','◈','Join and complete community-style quests'],['Guild','♜','Create your guild and city'],['Market','◇','Buy weapons and armor'],['Quest Shop','▤','Scrolls, potions and battle supplies'],['Customization Shop','✧','Frames and avatar accessories'],['Seasonal Shop','❄','Limited-time cosmetics'],['Time Traveler Shop','⌛','Returning rare cosmetics'],['Friends','♧','Manage a local friends roster'],['Achievements','✶','Your milestones'],['Focus','◉','Site-blocking concept'],['Settings','⚙','Save, export and onboarding']].map(([name,glyph,desc])=>`<button data-action="open-section" data-section="${name}"><span class="realm-symbol">${glyph}</span><div><strong>${name}</strong><small>${desc}</small></div><span>›</span></button>`).join('')}</div>`}
function realmSection(){let top=`<div class="section-top"><button class="back-button" data-action="section-back">‹</button><div><div class="eyebrow">THE ARCANA REALM</div><h1>${esc(section)}</h1></div></div>`;let content={Profile:profileView,Stats:statsView,Skills:skillsView,Equipment:equipmentView,Pets:petsView,Boss:bossView,Challenges:challengesView,Guild:guildView,Market:marketView,'Quest Shop':questShopView,'Customization Shop':()=>cosmeticShopView('Customization Shop'),'Seasonal Shop':()=>cosmeticShopView('Seasonal Shop'),'Time Traveler Shop':()=>cosmeticShopView('Time Traveler Shop'),Friends:friendsView,Achievements:achievementsView,Focus:focusView,Settings:settingsView}[section];return top+(content?content():'<p>Coming soon.</p>')}
function profileView(){return `<div class="profile-large"><div class="big-preview static bg-${state.avatar.bg}">${pixelHero(state.avatar,state.className)}</div><h2>${esc(state.name)}</h2><p>Level ${state.level} · ${esc(state.className)}</p>${button('Customize Character','avatar-edit','','btn primary')} ${button('Switch Class','class-switch','','btn outline')}</div>`}
function statsView(){let s=stats(state);return `<div class="panel"><h3>Vital Signs</h3>${[['HP',state.hp,maxHp(state.level),'hp'],['XP',state.xp,xpNeeded(state.level),'xp'],['MP',state.mp,maxMp(state.level),'mp']].map(([n,v,m,t])=>`<div class="stat-detail"><div><b>${n}</b><span>${v}/${m}</span></div>${bar(v,m,t)}</div>`).join('')}</div><div class="section-head"><h2>Attributes</h2></div><div class="stat-grid">${Object.entries(s).map(([key,v])=>`<div><span>${key.toUpperCase()}</span><strong>${v}</strong></div>`).join('')}</div><p class="muted-text">Stats reflect your class plus equipped gear. STR improves daily boss damage. DEF reduces missed-quest HP damage in a future balancing update.</p>`}
function skillsView(){return `<div class="panel"><div class="skill-heading"><span class="class-stamp" style="color:${CLASS_COLORS[state.className]}">${{Knight:'♜',Mage:'✦',Healer:'✚',Rogue:'◆',Bowman:'➶'}[state.className]}</span><div><h3>${state.className} Skills</h3><small>${state.level<10?'Locked until level 10':`${state.mp} MP available`}</small></div></div></div><div class="skill-list">${CLASS_SKILLS[state.className].map(([name,cost,desc],idx)=>`<div class="skill-card"><div class="skill-symbol">✦</div><div><strong>${name}</strong><small>${desc}</small><span>${cost} MP</span></div>${button(state.level<10?'Locked':'Cast','use-skill',`data-index="${idx}" ${state.level<10||state.mp<cost?'disabled':''}`,'btn outline')}</div>`).join('')}</div>${button('View Class Options','class-switch','','btn thin')}`}
function equipmentView(){let s=stats(state);return `<div class="panel"><div class="setting-line"><div><strong>Costume Mode</strong><small>Show vanity gear without changing combat stats.</small></div><label class="toggle"><input type="checkbox" id="costume-toggle" ${state.costumeMode?'checked':''}><span></span></label></div><div class="stat-mini">${Object.entries(s).map(([k,v])=>`<span>${k.toUpperCase()} ${v}</span>`).join('')}</div></div><div class="section-head"><h2>Gear Slots</h2><span>CLICK TO EQUIP</span></div><div class="equip-grid">${EQUIP_SLOTS.map(slot=>{let id=(state.costumeMode?state.costume:state.equipped)[slot],item=itemById(id);return `<button class="equip-slot" data-action="equip-select" data-slot="${slot}"><span class="equip-art">${item?equipmentArt(item.sprite):'<span class="empty-slot">✧</span>'}</span><strong>${slot}</strong><small>${item?esc(item.name):'Empty'}</small></button>`}).join('')}</div><div class="section-head"><h2>Owned Equipment</h2></div><div class="store-list">${state.owned.map(id=>{let i=itemById(id);if(!i)return '';return `<div class="store-line"><div class="store-symbol">${equipmentArt(i.sprite)}</div><div><strong>${esc(i.name)}</strong><small>${esc(i.slot)} · ${statsText(i.stats)}</small></div>${button('Equip','equip-item',`data-id="${i.id}"`,'btn outline')}</div>`}).join('')}</div>`}
function petsView(){return `<div class="pet-intro"><div class="egg-art">◈</div><div><strong>${state.eggs} unhatched egg${state.eggs===1?'':'s'}</strong><small>Earn eggs by defeating bosses.</small></div>${button('Hatch Egg','hatch-egg',state.eggs<1?'disabled':'','btn primary')}</div><div class="section-head"><h2>Your Companions</h2><span>${state.pets.length} COLLECTED</span></div><div class="pet-grid">${state.pets.length?state.pets.map(p=>`<div class="pet-tile"><div class="pet-art">${petArt(p)}</div><strong>${esc(p.name)}</strong><small style="color:${p.color}">${esc(p.rarity)}</small></div>`).join(''):'<div class="empty-card">Your first companion is waiting inside a future boss egg.</div>'}</div><div class="section-head"><h2>Hatching Rates</h2></div><div class="panel rarity-list">${PETS.map(p=>`<div><b style="color:${p.color}">${p.rarity}</b><span>${p.weight}%</span></div>`).join('')}</div>`}
function bossView(){let boss=getBoss(),max=boss.hp+Math.floor(state.bossWins/3)*35;return `<div class="boss-banner"><div class="boss-eyebrow">RAID BOSS · ${state.bossWins+1}</div><div class="boss-battle-art">${bossArt(state.bossWins)}</div><h2>${boss.name}</h2><p>${boss.subtitle}</p><div class="boss-hp"><div><strong>BOSS HP</strong><b>${state.bossHp} / ${max}</b></div>${bar(state.bossHp,max,'hp')}</div></div><div class="boss-metrics"><div><b>${state.damageQueued}</b><small>Pending damage</small></div><div><b>${state.bossWins}</b><small>Victories</small></div><div><b>${state.eggs}</b><small>Eggs to hatch</small></div></div><div class="panel"><h3>Battle Rules</h3><p>Habits and To-Dos queue attacks, which land when the date changes. Missed good habits cause HP loss. Strength boosts damage; level 10 skills add special effects.</p><p>Victory: +65 XP, +55 Gold, +1 pet egg and +45 guild XP.</p></div><div class="section-head"><h2>Combat Log</h2></div><div class="combat-log">${state.damageQueued?`<div class="combat-entry queued"><span>◈</span><div><strong>Damage queued</strong><small>${state.damageQueued} damage will strike on the next rollover</small></div></div>`:''}${state.combatLog.length?state.combatLog.map(c=>`<div class="combat-entry ${c.type}"><span>${c.type==='victory'?'✦':c.type==='hurt'?'−':'⚔'}</span><div><strong>${esc(c.text)}</strong><small>${c.day}</small></div></div>`).join(''):'<div class="empty-card">Your battle history will appear here after your first day ends.</div>'}</div>`}
function challengesView(){return `<div class="panel"><h3>Challenge Board</h3><p>Join a challenge to receive a one-time 20 gold entry bonus. Earn more rewards by completing its targets. Progress is tracked locally on this device.</p></div><div class="challenge-list">${CHALLENGES.map(c=>{let st=state.challenges[c.id],progress=st?.progress||0;return `<div class="challenge-card" style="--challenge:${c.color}"><div class="challenge-top"><div class="challenge-icon">✧</div><div><strong>${c.name}</strong><small>${c.desc}</small></div></div>${bar(progress,c.target,'xp')}<div class="challenge-foot"><span>${progress}/${c.target} · +${c.completionXP} XP · +${c.completionGold} gold</span>${!st?button('Join +20g','join-challenge',`data-id="${c.id}"`,'btn primary'):st.claimed?'<b class="claimed">REWARDED</b>':st.done?button('Claim Reward','claim-challenge',`data-id="${c.id}"`,'btn primary'):'<b class="joined">IN PROGRESS</b>'}</div></div>`}).join('')}</div>`}
function guildView(){let g=state.guild;if(!g.name)return `<div class="guild-welcome"><div class="guild-symbol">♜</div><h2>Build your guild.</h2><p>Create a guild for free. Upgrade your own city with XP earned from tasks and boss fights. Shared online guilds are planned for a future version.</p>${button('Create Guild','guild-create','','btn primary')}</div>`;let cityLevel=Object.values(g.buildings).reduce((a,b)=>a+b,0);return `<div class="guild-header"><div class="guild-crest">♜</div><div><div class="eyebrow">YOUR GUILD</div><h2>${esc(g.name)}</h2><small>City level ${cityLevel} · ${g.xp} Guild XP</small></div></div><div class="city-scene"><div class="city-stars">✦ · ✧ · ✦ · ✧</div><div class="city-buildings">${CITY_BUILDINGS.map(b=>`<div><span>${b.icon}</span><small>${esc(b.name)}</small><strong>Lv. ${g.buildings[b.id]||0}</strong></div>`).join('')}</div></div><div class="section-head"><h2>City Upgrades</h2><span>${g.xp} GUILD XP</span></div><div class="building-grid">${CITY_BUILDINGS.map(b=>{let level=g.buildings[b.id]||0,cost=b.base+level*25;return `<div class="building-card"><div class="building-icon">${b.icon}</div><strong>${b.name}</strong><small>${b.desc}</small><span>Level ${level}</span>${button(`Upgrade · ${cost} XP`,'city-upgrade',`data-id="${b.id}" ${g.xp<cost?'disabled':''}`,'btn outline')}</div>`}).join('')}</div><div class="section-head"><h2>Members</h2></div><div class="panel"><div class="setting-line"><strong>${esc(state.name)} <small>(Guild founder)</small></strong><span class="status-tag">ACTIVE</span></div><p>Guild friends stored here are a local roster, not connected players. Real invitations and shared raids require online accounts.</p>${state.friends.map(n=>`<div class="local-friend"><span>✦ ${esc(n)}</span><small>Local friend</small></div>`).join('')}</div>`}
function marketView(){return `<div class="market-head"><div><div class="eyebrow">MERCHANT'S INVENTORY</div><h2>Marketplace</h2></div><div class="pill-gold">${goldIcon} ${state.gold} gold</div></div><div class="store-list">${ITEMS.map(i=>`<div class="store-line"><div class="store-symbol">${equipmentArt(i.sprite)}</div><div><strong>${i.name}</strong><small>${i.slot} · ${i.rarity} · ${statsText(i.stats)}</small></div>${state.owned.includes(i.id)?'<span class="owned">OWNED</span>':button(`${goldIcon} ${i.cost}`,'buy-item',`data-id="${i.id}" ${state.gold<i.cost?'disabled':''}`,'btn gold-button')}</div>`).join('')}</div>`}
function questShopView(){return `<div class="panel"><h3>Quest Shop</h3><p>Spend gold on useful consumables that affect your current adventure immediately.</p></div><div class="store-list">${QUEST_SHOP.map(i=>`<div class="store-line"><div class="store-symbol">✦</div><div><strong>${esc(i.name)}</strong><small>${esc(i.desc)}</small></div>${button(`${goldIcon} ${i.cost}`,'buy-quest-item',`data-id="${i.id}" ${state.gold<i.cost?'disabled':''}`,'btn gold-button')}</div>`).join('')}</div>`}
function cosmeticShopView(shop){let data=COSMETICS.filter(c=>c.shop===shop);return `<div class="panel"><h3>${shop}</h3><p>${shop==='Seasonal Shop'?'A curated collection of seasonal appearance rewards.':shop==='Time Traveler Shop'?'Returning event cosmetics at a premium.':'Make your avatar portrait unique without changing equipment stats.'}</p></div><div class="store-list">${data.map(c=>`<div class="store-line"><div class="store-symbol">${c.icon}</div><div><strong>${esc(c.name)}</strong><small>${c.type} · appearance only</small></div>${state.ownedCosmetics.includes(c.id)?button(state.activeCosmetics[c.type]===c.id?'Active':'Equip','activate-cosmetic',`data-id="${c.id}"`,'btn outline'):button(`${goldIcon} ${c.cost}`,'buy-cosmetic',`data-id="${c.id}" ${state.gold<c.cost?'disabled':''}`,'btn gold-button')}</div>`).join('')}</div>`}
function friendsView(){return `<div class="panel"><h3>Friends (local roster)</h3><p>Add names you want to invite to your guild when online play is introduced. This does not contact or connect real players.</p>${button('+ Add Friend','add-friend','','btn primary')}</div><div class="store-list">${state.friends.map((name,i)=>`<div class="store-line"><div class="store-symbol">♧</div><div><strong>${esc(name)}</strong><small>Saved locally · guild roster preview</small></div>${button('Remove','remove-friend',`data-index="${i}"`,'btn outline')}</div>`).join('')||'<div class="empty-card">Your friends list is empty.</div>'}</div>`}
function achievementsView(){let list=[['First Quest',state.habitChecks+state.todoChecks>0],['Level Five',state.level>=5],['Awakened Class',state.level>=10],['The First Boss',state.bossWins>0],['Pet Keeper',state.pets.length>0],['Guild Founder',!!state.guild.name],['Challenge Champion',Object.values(state.challenges).some(c=>c.claimed)]];return `<div class="achievement-grid">${list.map(([n,done])=>`<div class="achievement ${done?'unlocked':''}"><span>${done?'✦':'♧'}</span><strong>${n}</strong><small>${done?'UNLOCKED':'LOCKED'}</small></div>`).join('')}</div>`}
function focusView(){return `<div class="panel"><h3>Restriction Planner</h3><p>Choose categories to limit. These preferences are saved, but a standalone browser app cannot block websites outside itself or prevent users from changing browser/system restrictions.</p><div class="restriction-list">${['adult content','social media','short videos','games','news'].map(cat=>`<label><input type="checkbox" data-restrict="${esc(cat)}" ${state.selectedRestrictions.includes(cat)?'checked':''}><span>${cap(cat)}</span></label>`).join('')}</div></div><div class="panel"><h3>Restricted Mode</h3><div class="setting-line"><div><strong>Intent-based restriction</strong><small>For the future native app, adult-content restrictions should never be purchasably bypassed.</small></div><span class="status-tag">NOT ENFORCED</span></div><p>Gold can purchase manually tracked leisure time, not disable device-level parental controls or non-negotiable restrictions.</p>${button('Open Rewards','nav-rewards','','btn outline')}</div>`}
function settingsView(){return `<div class="panel settings-list"><div><strong>Revisit Merlin</strong><small>Replay onboarding without deleting your habits, pets, guild or stats.</small>${button('Replay Onboarding','replay-onboarding','','btn outline')}</div><div><strong>Save Backup</strong><small>Export a complete JSON backup of your game.</small>${button('Export Save','export-save','','btn outline')}</div><div><strong>Import Backup</strong><small>Restore your ARCANA v2 JSON save.</small><label class="btn outline file-button">Import Save <input type="file" id="save-import" accept="application/json,.json" hidden></label></div><div><strong>Start Screen</strong><small>Choose whether to continue or revisit Merlin.</small>${button('Go to Start','go-start','','btn outline')}</div><div><strong>Reset All Progress</strong><small>Deletes this device's ARCANA v2 save permanently.</small>${button('Reset Game','reset-game','','btn danger')}</div></div>`}
function modalView(){let head=(title,content)=>`<div class="modal-overlay" data-action="modal-dismiss"><div class="modal-card" role="dialog" aria-modal="true"><div class="modal-header"><h2>${title}</h2>${button('×','modal-close','','close')}</div>${content}</div></div>`;
if(modal==='habit-add')return head('Create a Habit',`<form id="habit-form"><label>Habit name<input name="title" maxlength="70" required placeholder="e.g. Read 10 pages"></label><label>Type<select name="kind"><option value="good">Build a good habit</option><option value="bad">Break a bad habit</option></select></label><label>Frequency<select name="rhythm" id="frequency-select"><option value="daily">Every day</option><option value="every">Every N days</option><option value="monthly">Monthly</option><option value="weekdays">Custom weekdays</option></select></label><div id="frequency-extra"></div><button class="btn primary full" type="submit">Create Habit</button></form>`);
if(modal==='todo-add')return head('Create To-Do',`<form id="todo-form"><label>Quest name<input name="title" required maxlength="90" placeholder="One thing you want to finish"></label><label>Due date (optional)<input type="date" name="dueDate"></label><button class="btn primary full">Add To-Do</button></form>`);
if(modal==='reward-add')return head('Custom Reward',`<form id="reward-form"><label>Reward name<input name="title" required maxlength="60" placeholder="Relaxing 20-minute break"></label><label>Minutes<input name="minutes" type="number" min="1" max="180" value="20" required></label><label>Gold cost<input name="cost" type="number" min="1" max="1000" value="35" required></label><button class="btn primary full">Create Reward</button></form>`);
if(modal==='add-friend')return head('Add Local Friend',`<form id="friend-form"><label>Friend name<input name="name" maxlength="32" required placeholder="Friend display name"></label><p>Saved only in your device's local roster; no invitation is sent.</p><button class="btn primary full">Save Friend</button></form>`);
if(modal==='guild-create')return head('Create Your Guild',`<form id="guild-form"><label>Guild name<input name="name" maxlength="32" required placeholder="The Midnight Order"></label><p>Creating your guild costs no gold. Guild XP comes from completing habits, to-dos and boss victories.</p><button class="btn primary full">Found Guild</button></form>`);
if(modal==='avatar-edit')return head('Customize Hero',`<div class="avatar-editor"><div class="edit-preview" id="edit-preview">${pixelHero(workingAvatar,state.className,true)}</div><div class="editor-wheels" id="avatar-wheels">${avatarWheels()}</div></div>${button('Save Appearance','save-avatar','','btn primary full')}`);
if(modal==='equip-select'){let slot=window.activeGearSlot||'Weapon';return head(`Equip ${esc(slot)}`,`<div class="gear-picker">${state.owned.map(id=>itemById(id)).filter(i=>i&&i.slot===slot).map(i=>`<button data-action="equip-item" data-id="${i.id}">${equipmentArt(i.sprite)}<span><b>${esc(i.name)}</b><small>${statsText(i.stats)}</small></span><span>›</span></button>`).join('')||'<p>No gear in this slot. Visit the Market to buy some.</p>'}</div>${button('Visit Market','go-market','','btn outline full')}`)}
if(modal==='class-switch')return head('Choose Class',`<p>${state.level<10?'Classes unlock for switching at level 10. Your original class is not lost.':'Switch classes freely. Class progress remains saved.'}</p><div class="class-modal-list">${CLASSES.map(c=>`<button data-action="switch-class" data-class="${c}" ${state.level<10&&c!==state.className?'disabled':''}><span style="color:${CLASS_COLORS[c]}">${{Knight:'♜',Mage:'✧',Healer:'✚',Rogue:'◆',Bowman:'➶'}[c]}</span><strong>${c}</strong>${c===state.className?'✓':''}</button>`).join('')}</div>`);
if(modal==='habit-options'){let h=state.habits.find(h=>h.id===window.activeHabit);return head('Habit Options',`<h3>${esc(h?.title||'Habit')}</h3><p>Deleting a habit removes its future check-ins and streak.</p>${button('Delete Habit','delete-habit','','btn danger full')}`)}
return ''}
function goTab(t){tab=t;section='';modal='';render();window.scrollTo(0,0)}
function goSection(s){tab='realm';section=s;modal='';render();window.scrollTo(0,0)}
function mutate(fn){if(!state)return;let result=fn(state);sync();render();return result}
function handleClick(event){let b=event.target.closest('[data-action]');if(!b)return;let act=b.dataset.action,id=b.dataset.id;event.preventDefault();
if(act==='continue'){if(state){resolveDays(state);sync();screen='game';render()}return}
if(act==='new-onboarding'||act==='replay-onboarding'){newOnboarding(!!state);return}
if(act==='on-back'){if(onStep>0){onStep--;render()}else showSplash();return}
if(act==='on-next'){if(!dialogEnded||(onStep===0&&!workingName.trim()))return;if(onStep<2){onStep++;render()}else{root.querySelector('.onboard')?.classList.add('exit');setTimeout(()=>{if(state){state.name=workingName.trim()||state.name;state.avatar={...workingAvatar};state.className=workingClass;sync()}else{state=defaultSave(workingName,workingClass,workingAvatar);state.eggs=1;sync()}screen='game';tab='habits';section='';render();notify('Your adventure begins!')},750)}return}
if(act==='wheel-prev'||act==='wheel-next'||act==='wheel-set'){let key=b.dataset.key,options=AVATAR_OPTIONS[key];if(!options)return;workingAvatar[key]=act==='wheel-set'?Number(b.dataset.value):(workingAvatar[key]+(act==='wheel-next'?1:-1)+options.length)%options.length;if(screen==='onboarding')updateWheelPanel();else updateModalAvatar();return}
if(act==='choose-class'){if(state&&state.level<10&&b.dataset.class!==state.className)return;workingClass=b.dataset.class;document.querySelectorAll('.class-card').forEach(el=>el.classList.toggle('selected',el.dataset.class===workingClass));renderClassCards();return}
if(act==='tab'){goTab(b.dataset.tab);return}
if(act==='open-section'){goSection(b.dataset.section);return}
if(act==='section-back'){section='';render();return}
if(act==='filter-habit'){habitFilter=b.dataset.filter;render();return}
if(act==='habit-add'||act==='todo-add'||act==='reward-add'||act==='guild-create'||act==='add-friend'){modal=act;render();return}
if(act==='modal-close'||act==='modal-dismiss'){if(act==='modal-dismiss'&&event.target!==b)return;modal='';render();return}
if(act==='avatar-edit'){workingAvatar={...AVATAR_DEFAULT,...state.avatar};modal='avatar-edit';render();return}
if(act==='save-avatar'){mutate(s=>{s.avatar={...workingAvatar};log(s,'Avatar customized')});modal='';render();notify('Appearance saved');return}
if(act==='habit-options'){window.activeHabit=id;modal='habit-options';render();return}
if(act==='delete-habit'){mutate(s=>s.habits=s.habits.filter(h=>h.id!==window.activeHabit));modal='';render();notify('Habit removed');return}
if(act==='finish-habit'){let result=mutate(s=>completeHabit(s,id));if(result)notify('✓ Quest complete · +12 XP +5 gold');return}
if(act==='slip-habit'){if(mutate(s=>recordSlip(s,id)))notify('Slip logged · your next day is a fresh chance');return}
if(act==='finish-todo'){if(mutate(s=>completeTodo(s,id)))notify('✓ To-Do complete · +18 XP +8 gold');return}
if(act==='remove-todo'){mutate(s=>s.todos=s.todos.filter(t=>t.id!==id));return}
if(act==='buy-cosmetic'){if(mutate(s=>buyCosmetic(s,id)))notify('Cosmetic purchased');else notify('Not enough gold');return}
if(act==='activate-cosmetic'){if(mutate(s=>activateCosmetic(s,id)))notify('Cosmetic equipped');return}
if(act==='buy-quest-item'){if(mutate(s=>buyQuestItem(s,id)))notify('Quest item used');else notify('Not enough gold');return}
if(act==='remove-friend'){mutate(s=>s.friends.splice(Number(b.dataset.index),1));notify('Friend removed from local roster');return}
if(act==='buy-item'){if(mutate(s=>buyItem(s,id)))notify(`${itemById(id).name} purchased`);else notify('Not enough gold');return}
if(act==='equip-select'){window.activeGearSlot=b.dataset.slot;modal='equip-select';render();return}
if(act==='equip-item'){if(mutate(s=>equip(s,id,s.costumeMode)))notify('Gear equipped');modal='';render();return}
if(act==='go-market'){goSection('Market');return}
if(act==='hatch-egg'){let pet=mutate(s=>hatch(s));if(pet){notify(`✦ ${pet.name} hatched! ${pet.rarity}`)}else notify('No eggs yet');return}
if(act==='use-skill'){if(mutate(s=>useSkill(s,Number(b.dataset.index))))notify('Skill cast!');else notify('Requires level 10 and enough MP');return}
if(act==='class-switch'){modal='class-switch';render();return}
if(act==='switch-class'){let c=b.dataset.class;if(state.level<10&&state.className!==c)return;mutate(s=>{s.classProgress[s.className]=Math.max(s.classProgress[s.className]||1,s.level);s.className=c;log(s,`Changed class to ${c}`)});modal='';render();notify(`Class changed to ${c}`);return}
if(act==='join-challenge'){if(mutate(s=>joinChallenge(s,id)))notify('Challenge joined · +20 gold');return}
if(act==='claim-challenge'){if(mutate(s=>claimChallenge(s,id)))notify('Challenge rewards claimed!');return}
if(act==='city-upgrade'){if(mutate(s=>buyCity(s,id)))notify('Guild city upgraded');else notify('Not enough Guild XP');return}
if(act==='buy-reward'){mutate(s=>{let r=s.rewards.find(r=>r.id===id);if(!r||s.gold<r.cost)return;s.gold-=r.cost;s.rewardMinutes+=r.minutes;log(s,`Purchased ${r.title}`)});notify('Reward allowance purchased');return}
if(act==='spend-minutes'){let min=Number(b.dataset.minutes);if(mutate(s=>{if(s.rewardMinutes<min)return false;s.rewardMinutes-=min;log(s,`Used ${min} minutes of break allowance`);return true}))notify(`${min} minutes recorded`);return}
if(act==='export-save'){exportSave(state);notify('Backup exported');return}
if(act==='go-start'){showSplash();return}
if(act==='nav-rewards'){goTab('rewards');return}
if(act==='reset-game'){if(confirm('Delete all ARCANA progress from this device? This cannot be undone.')){localStorage.removeItem(STORE);state=null;showSplash()}return}
}
function renderClassCards(){let cards=document.querySelector('.class-grid');if(cards)cards.innerHTML=CLASSES.map(classCard).join('')}
function updateWheelPanel(){let prev=document.querySelector('#avatar-preview');if(prev)prev.innerHTML=pixelHero(workingAvatar,workingClass,true);let foot=document.querySelector('.preview-footer span');if(foot)foot.textContent=BG[workingAvatar.bg];updateWheelList()}
function updateModalAvatar(){let prev=document.querySelector('#edit-preview');if(prev)prev.innerHTML=pixelHero(workingAvatar,state.className,true);updateWheelList()}
function updateWheelList(){let holder=document.querySelector('#avatar-wheels');if(!holder)return;let before=[...holder.querySelectorAll('.wheel')].map(w=>[w.dataset.wheel,w.scrollLeft]);holder.innerHTML=avatarWheels();before.forEach(([key,n])=>{let el=holder.querySelector(`[data-wheel="${key}"]`);if(el)el.scrollLeft=n})}
function frequencyExtras(){let el=document.querySelector('#frequency-extra'),sel=document.querySelector('#frequency-select');if(!el||!sel)return;el.innerHTML=sel.value==='every'?'<label>Repeat every <input type="number" name="everyDays" min="2" max="7" value="3"></label>':sel.value==='weekdays'?`<label>Choose weekdays</label><div class="weekday-checks">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((n,i)=>`<label><input type="checkbox" name="weekdays" value="${i}" ${i>0&&i<6?'checked':''}><span>${n}</span></label>`).join('')}</div>`:''}
root.addEventListener('click',handleClick);
root.addEventListener('input',ev=>{if(ev.target.id==='hero-name'){workingName=ev.target.value;refreshContinue()}});
root.addEventListener('change',ev=>{let t=ev.target;if(t.id==='frequency-select'){frequencyExtras()}else if(t.id==='costume-toggle'){mutate(s=>s.costumeMode=t.checked)}else if(t.dataset.restrict){let c=t.dataset.restrict;mutate(s=>{s.selectedRestrictions=t.checked?[...new Set([...s.selectedRestrictions,c])]:s.selectedRestrictions.filter(x=>x!==c)})}});
root.addEventListener('submit',ev=>{ev.preventDefault();let f=ev.target,d=new FormData(f);if(f.id==='habit-form'){let title=String(d.get('title')||'').trim(),kind=String(d.get('kind')||'good'),rhythm=String(d.get('rhythm')||'daily'),every=Math.max(2,Math.min(7,Number(d.get('everyDays'))||2)),weekdays=d.getAll('weekdays').map(Number);if(!title||(rhythm==='weekdays'&&!weekdays.length)){notify('Choose at least one weekday');return}mutate(s=>addHabit(s,title,kind,rhythm,every,weekdays));modal='';render();notify('Habit added')}else if(f.id==='todo-form'){let title=String(d.get('title')||'').trim();if(!title)return;mutate(s=>s.todos.unshift({id:uid(),title,dueDate:String(d.get('dueDate')||''),done:false}));modal='';render();notify('To-Do added')}else if(f.id==='reward-form'){let title=String(d.get('title')||'').trim(),minutes=Number(d.get('minutes')),cost=Number(d.get('cost'));if(!title||minutes<1||cost<1)return;mutate(s=>s.rewards.push({id:uid(),title,minutes,cost}));modal='';render();notify('Custom reward created')}else if(f.id==='friend-form'){let name=String(d.get('name')||'').trim();if(!name)return;mutate(s=>{if(!s.friends.includes(name))s.friends.push(name)});modal='';render();notify('Friend added locally')}else if(f.id==='guild-form'){let name=String(d.get('name')||'').trim();if(!name)return;mutate(s=>{s.guild.name=name;log(s,`Founded guild ${name}`)});modal='';render();notify('Guild founded') }});
root.addEventListener('change',async ev=>{if(ev.target.id==='save-import'){let file=ev.target.files?.[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!data?.name||!Array.isArray(data.habits))throw Error('Invalid save');if(!confirm(`Import the saved adventure of ${data.name}? This replaces your current adventure.`))return;state=data.version===1?migrateV1(data):hydrate(data);sync();screen='game';tab='habits';section='';render();notify('Save restored successfully')}catch(e){notify('Invalid or unsupported save file')}}});
if(state){resolveDays(state);sync()}
render();
</script></body></html>
